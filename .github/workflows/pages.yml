name: Render slides and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "scene/**"
      - "web/**"
      - "render.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The official image already has Manim, LaTeX and the system libraries it needs.
    container:
      image: manimcommunity/manim:v0.19.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install Manim Slides and ffmpeg
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
          pip install --no-cache-dir "manim-slides==5.5.1"

      # Manim caches every animation it renders, so unchanged scenes come back almost instantly.
      - name: Restore render cache
        uses: actions/cache@v4
        with:
          path: |
            media
            slides
          key: render-${{ hashFiles('scene/**', 'render.sh') }}
          restore-keys: render-

      - name: Render the slides
        run: ./render.sh site/slides.html

      - name: Build the site
        run: python web/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
